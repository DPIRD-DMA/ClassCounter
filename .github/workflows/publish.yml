name: Publish to PyPI

# Triggered by pushing a tag that looks like a version, e.g. `v0.2.0`.
# The package version comes from the tag itself (hatch-vcs).
# Publishing uses PyPI trusted publishing (OIDC): no API tokens, no secrets.
# To enable: at https://pypi.org/manage/project/classcounter/settings/publishing/
# add a publisher with:
#   Owner            DPIRD-DMA
#   Repository name  ClassCounter
#   Workflow name    publish.yml
#   Environment      pypi

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so hatch-vcs can read the version tag

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v8.0.0

      - name: Build sdist + wheel
        run: uv build

      # Guard against publishing a dev version if the tag wasn't picked up.
      - name: Check version matches tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          ls dist/
          test -f "dist/classcounter-${expected}.tar.gz" || {
            echo "::error::built version does not match tag ${GITHUB_REF_NAME}"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/classcounter
    permissions:
      id-token: write  # required for trusted publishing

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create releases

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
