[project]
name = "classcounter"
dynamic = ["version"]
description = "Fast class counting for numpy arrays, torch tensors, and GeoTIFFs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Nick Wright", email = "nicholas.wright@dpird.wa.gov.au" }]
keywords = ["numpy", "torch", "geotiff", "raster", "classification", "bincount"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/DPIRD-DMA/ClassCounter"
Repository = "https://github.com/DPIRD-DMA/ClassCounter"
Issues = "https://github.com/DPIRD-DMA/ClassCounter/issues"

[project.optional-dependencies]
torch = ["torch>=2.0"]
geo = ["rasterio>=1.3"]
numba = ["numba>=0.60"]
all = ["torch>=2.0", "rasterio>=1.3", "numba>=0.60"]
test = ["pytest>=8.0", "pytest-cov>=6.0"]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
    "torch>=2.0",
    "rasterio>=1.3",
    "numba>=0.60",
    "jupyter>=1.1.1",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "matplotlib>=3.10.8",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version comes from the latest git tag (e.g. v0.2.0), so releasing is
# just tagging; see RELEASING.md.
[tool.hatch.version]
source = "vcs"

# Packagers such as conda-forge build from the sdist and run its tests, so it
# keeps the package, tests/, LICENSE, README and CHANGELOG but not dev-only files.
[tool.hatch.build.targets.sdist]
exclude = [
    ".claude/",
    ".github/",
    ".pre-commit-config.yaml",
    "RELEASING.md",
    "Examples.ipynb",
    "benchmark_backends.ipynb",
    "benchmarks/",
    "images/",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["classcounter"]
ignore_missing_imports = true
strict = true

# numba ships no type information, so its decorators erase signatures and
# compiled-kernel calls return Any. The wrappers' annotations document the
# real types.
[[tool.mypy.overrides]]
module = "classcounter._numba"
disallow_untyped_decorators = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "torch: tests requiring PyTorch",
    "numba: tests requiring numba",
    "geo: tests requiring rasterio",
    "slow: tests with large arrays or long runtime",
    "install: isolated install tests (slow, uses uv run --script)",
]
# The install tests need network access (uv run --script), so they're
# deselected by default for offline builds; run them with `pytest -m install`.
addopts = '-v --strict-markers --tb=short -m "not install"'

[tool.coverage.run]
source = ["classcounter"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 85
precision = 2
